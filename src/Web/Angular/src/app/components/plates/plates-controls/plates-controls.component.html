<div class="flex justify-start my-4">
    <button 
        type="button" 
        class="bg-green-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-green-700 " 
        (click)="createPlate()">
        Add Plate
    </button>
</div>

<form *ngIf="showCreateForm" #f="ngForm" (ngSubmit)="onSubmit(f)" novalidate class="bg-white p-6  rounded-lg shadow-lg w-96 absolute">
    <div class="flex flex-col mb-4">
        <label for="registration" class="font-semibold mb-1">Registration</label>
        <input 
            type="text" 
            name="registration" 
            [(ngModel)]="registration" 
            required 
            class="border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="flex flex-col mb-4">
        <label for="salePrice" class="font-semibold mb-1">Sale Price</label>
        <input 
            type="number" 
            name="salePrice" 
            [(ngModel)]="salePrice" 
            required 
            class="border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="flex flex-col mb-4">
        <label for="purchasePrice" class="font-semibold mb-1">Purchase Price</label>
        <input 
            type="number" 
            name="purchasePrice" 
            [(ngModel)]="purchasePrice" 
            required 
            class="border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="flex justify-between mt-4">
        <button 
            type="submit" 
            class="bg-green-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-green-700 transition-all">
            Save
        </button>
        <button 
            type="button" 
            (click)="createPlate()"
            class="bg-red-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-red-700 transition-all">
            Cancel
        </button>
    </div>
</form>
